                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const CO3 = Buffer.from(data.content, 'base64').toString('utf8');
                return { CO3, xEuP: data.sha };
              } catch (e) {
                if (e.status === 404) return { CO3: '', xEuP: undefined };
